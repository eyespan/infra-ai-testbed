  - "OIDC uses short-lived AWS credentials rather than long-lived access keys"
  - "Every job has an explicit timeout"
  - "Slack notification helper has an Actions composite equivalent"
  - "Environment-scoped Slack secret requirement is documented"
  - "Image tag uses a 12-character commit SHA"
  - "Staging and production deployment assumptions are documented"
  - "No workflow execution or production deployment is performed during migration"

