critical_security_notes: "No plaintext production credentials are committed, no static AWS access keys are used, pull_request jobs do not receive deployment credentials or package-write permissions, checkout disables persisted credentials, and production deployment uses a protected GitHub Environment. No automatic critical-security-fail condition is present."

findings:
  - severity: medium
    title: "Trivy container image is tag-pinned rather than digest-pinned"
    evidence: "deploy.yml runs aquasec/trivy:0.57.1. MIGRATION.md explicitly states that the platform image allowlist should replace the release tag with a verified immutable digest before enabling the workflow."
    dimension: security

  - severity: low
    title: "actionlint validation was unavailable"
    evidence: "Local validation output reports 'actionlint: NOT INSTALLED'. Ruby YAML parsing succeeded for all five workflow/action YAML files, but GitHub Actions semantic validation was therefore not independently performed."
    dimension: correctness

  - severity: low
    title: "Production reviewer configuration exists outside the repository"
    evidence: "deploy.yml uses 'environment: production' and MIGRATION.md documents that required reviewers must be configured under GitHub Settings > Environments > production."
    dimension: reliability

  - severity: low
    title: "OIDC credential exchange is implemented as a custom composite action"
    evidence: "configure-aws-oidc/action.yml directly obtains the GitHub Actions OIDC token and calls aws sts assume-role-with-web-identity rather than using the standard aws-actions/configure-aws-credentials action."
    dimension: security

  - severity: low
    title: "Workflow was validated statically but not executed"
    evidence: "Codex reported that no workflow was pushed or run as part of the migration. Local Ruby YAML parsing and git diff --check passed."
    dimension: correctness

