merge_rationale: "Strong migration that preserves the important Jenkins behaviors and addresses the major security and reliability requirements: protected production approval, main-only deployment, OIDC credentials, pinned checkout/cache actions, lockfile-aware caching, failing Trivy scan, concurrency control, timeouts, integration testing, environment-scoped secrets, and executable rollback. Would merge after normal review, with the Trivy image pinned by digest, actionlint validation performed, and GitHub Environment reviewers plus AWS OIDC trust-policy constraints verified."

