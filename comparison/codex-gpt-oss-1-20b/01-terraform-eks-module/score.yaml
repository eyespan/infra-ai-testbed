critical_security_notes: "The security scan found 0.0.0.0/0 entries in the Terraform module, but the provided evidence does not indicate that these represent unrestricted SSH/RDP access. The implementation is documented as using private worker subnets and controlled cluster/node networking. No AdministratorAccess, cluster-admin, wildcard IAM Action, or wildcard IAM Resource pattern was detected by the supplied scan. KMS-backed EKS encryption and CloudWatch logging are documented."

findings:
  - severity: medium
    title: "CIDR-wide rules require explicit review"
    evidence: "The supplied Terraform security scan reported 0.0.0.0/0 at three locations in modules/eks/main.tf. The scan alone does not establish that these are unsafe management-plane ingress rules; they should nevertheless be reviewed before production deployment to confirm that public CIDR-wide rules are limited to required egress/load-balancer paths."
    dimension: security

  - severity: low
    title: "No live AWS plan was performed"
    evidence: "terraform validate passed successfully from the staging root after provider/module initialization. The README explicitly states that validate does not prove an AWS plan will succeed and requires a real reviewed plan with authorized credentials."
    dimension: correctness

  - severity: low
    title: "Three-AZ minimum is an intentional regional constraint"
    evidence: "The README states that the module fails during planning if the selected region has fewer than three AZs. This is safer than silently producing an incomplete topology, but it means the module cannot be used unchanged in a two-AZ region."
    dimension: edge_cases

  - severity: low
    title: "Node update disruption depends on workload redundancy"
    evidence: "The README documents one unavailable node during node updates and explicitly requires workload replicas, PDBs, and capacity headroom for safe production operation."
    dimension: reliability

  - severity: low
    title: "Remote state and locking remain caller responsibilities"
    evidence: "The README requires an encrypted remote state backend with locking and restricted access before a real apply rather than silently embedding backend infrastructure in the module."
    dimension: reliability

