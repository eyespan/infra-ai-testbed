critical_security_notes: "No plaintext Grafana or PagerDuty credentials were committed. Grafana administrator credentials are consumed from an externally provisioned Kubernetes Secret. Prometheus uses a dedicated ServiceAccount and restricted ClusterRole. Kubelet cAdvisor scraping uses the authenticated Kubernetes API proxy rather than an unauthenticated kubelet endpoint."

findings:
  - severity: medium
    title: "Alertmanager is single-replica with ephemeral storage"
    evidence: "alertmanager.yaml specifies replicas: 1 and emptyDir storage. OPERATIONAL_NOTES.md explicitly documents the lack of Alertmanager HA mesh and the loss of silences/notification history after rescheduling."
    dimension: reliability

  - severity: medium
    title: "ServiceMonitor is inconsistent with standalone Prometheus architecture"
    evidence: "payments-servicemonitor.yaml defines a monitoring.coreos.com/v1 ServiceMonitor, while the supplied Prometheus deployment is standalone and uses an explicit Kubernetes endpoints scrape in prometheus-config.yaml. The payments scrape therefore does not depend on the ServiceMonitor, but the unused Operator resource introduces architectural ambiguity."
    dimension: correctness

  - severity: low
    title: "Prometheus is single-replica"
    evidence: "prometheus.yaml specifies replicas: 1. OPERATIONAL_NOTES.md explicitly describes the stack as a minimal single-replica design and recommends sharding or federation for larger clusters."
    dimension: reliability

  - severity: low
    title: "Prometheus resource sizing is only a small-cluster starting point"
    evidence: "OPERATIONAL_NOTES.md states that the 2-4 Gi Prometheus allocation is intended as a starting point for roughly a three-node cluster and explicitly requires measured ingest and scaling work for a 500-node cluster."
    dimension: edge_cases

  - severity: low
    title: "Container images are version-tagged rather than digest-pinned"
    evidence: "Prometheus, Grafana, Alertmanager, and kube-state-metrics images use immutable-looking version tags but no image digests."
    dimension: security

