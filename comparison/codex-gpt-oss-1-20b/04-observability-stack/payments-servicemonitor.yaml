apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payments
  namespace: prod
  labels:
    app: payments
spec:
  namespaceSelector:
    matchNames: [prod]
  selector:
    matchLabels:
      app: payments
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
