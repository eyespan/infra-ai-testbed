apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/rules/*.yaml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: [alertmanager.monitoring.svc:9093]
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: [localhost:9090]
      - job_name: kube-state-metrics
        static_configs:
          - targets: [kube-state-metrics.monitoring.svc:8080]
      # cAdvisor is accessed through the authenticated API server proxy; no
      # direct, unauthenticated kubelet endpoint is exposed.
      - job_name: kubelet-cadvisor
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/${1}/proxy/metrics/cadvisor
          - target_label: __address__
            replacement: kubernetes.default.svc:443
      # Scrape only the known payments metrics Service in prod. The relabel
      # filter deliberately prevents an all-pods scrape/cardinality surprise.
      - job_name: payments
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names: [prod]
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_label_app]
            regex: payments
            action: keep
          - source_labels: [__meta_kubernetes_endpoint_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_service_name]
            target_label: service
          - action: labeldrop
            regex: (pod_uid|container_id|image_id)
