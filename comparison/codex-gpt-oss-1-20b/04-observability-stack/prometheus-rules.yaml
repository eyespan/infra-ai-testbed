apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yaml: |
    groups:
      - name: platform-critical
        rules:
          - alert: PodCrashLooping
            expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping
          - alert: ContainerMemoryLimitNear
            expr: (container_memory_working_set_bytes{container!="",image!=""} / on (namespace,pod,container) kube_pod_container_resource_limits{resource="memory",unit="byte"}) > 0.90
            for: 15m
            labels:
              severity: critical
            annotations:
              summary: Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} exceeds 90% of its memory limit
          - alert: NodeDiskPressure
            expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Node {{ $labels.node }} reports DiskPressure
      - name: dashboard-recording
        rules:
          - record: namespace:container_memory_working_set_bytes:sum
            expr: sum by (namespace) (container_memory_working_set_bytes{container!="",image!=""})
