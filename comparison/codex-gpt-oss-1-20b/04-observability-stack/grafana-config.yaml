apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc:9090
        isDefault: true
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: cluster
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-overview.json: |
    {"title":"Cluster overview","schemaVersion":39,"panels":[{"type":"stat","title":"Ready nodes","targets":[{"expr":"sum(kube_node_status_condition{condition=\\"Ready\\",status=\\"true\\"})"}]},{"type":"timeseries","title":"Namespace memory","targets":[{"expr":"namespace:container_memory_working_set_bytes:sum"}]}]}
