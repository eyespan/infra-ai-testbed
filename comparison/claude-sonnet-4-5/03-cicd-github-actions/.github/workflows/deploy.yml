name: Build and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Concurrency control - prevent concurrent deploys to same ref
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  APP: payments-api
  REGISTRY: ghcr.io/example
  NODE_VERSION: '20'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run integration tests
        run: docker compose -f docker-compose.test.yml up --abort-on-container-exit

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45

    outputs:
      image-tag: ${{ steps.image-info.outputs.tag }}
      image-full: ${{ steps.image-info.outputs.full }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: image-info
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-12)
          echo "tag=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "full=${{ env.REGISTRY }}/${{ env.APP }}:$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image-info.outputs.full }}
            ${{ env.REGISTRY }}/${{ env.APP }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    environment:
      name: staging
      url: https://staging.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        uses: ./.github/actions/deploy
        with:
          environment: staging
          image-tag: ${{ needs.build-and-push.outputs.image-tag }}
          registry: ${{ env.REGISTRY }}
          app-name: ${{ env.APP }}
          deploy-token: ${{ secrets.STAGING_DEPLOY_TOKEN }}
          kubectl-config: ${{ secrets.STAGING_KUBECONFIG }}

      - name: Notify Slack
        if: always()
        uses: ./.github/actions/notify-slack
        with:
          message: "staging ${{ needs.build-and-push.outputs.image-tag }}"
          status: ${{ job.status }}
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

  approve-production:
    name: Approve Production Deployment
    runs-on: ubuntu-latest
    needs: [build-and-push, deploy-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    environment:
      name: production-approval

    steps:
      - name: Manual approval gate
        run: |
          echo "✓ Deployment to production approved"
          echo "Image tag: ${{ needs.build-and-push.outputs.image-tag }}"
          echo "Image: ${{ needs.build-and-push.outputs.image-full }}"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, approve-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 45
    environment:
      name: production
      url: https://production.example.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production
        id: deploy-prod
        uses: ./.github/actions/deploy
        with:
          environment: production
          image-tag: ${{ needs.build-and-push.outputs.image-tag }}
          registry: ${{ env.REGISTRY }}
          app-name: ${{ env.APP }}
          deploy-token: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
          kubectl-config: ${{ secrets.PRODUCTION_KUBECONFIG }}

      - name: Notify Slack on success
        if: success()
        uses: ./.github/actions/notify-slack
        with:
          message: "production ${{ needs.build-and-push.outputs.image-tag }}"
          status: success
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Rollback on failure
        if: failure()
        uses: ./.github/actions/rollback
        with:
          environment: production
          deploy-token: ${{ secrets.PRODUCTION_DEPLOY_TOKEN }}
          kubectl-config: ${{ secrets.PRODUCTION_KUBECONFIG }}

      - name: Notify Slack on failure
        if: failure()
        uses: ./.github/actions/notify-slack
        with:
          message: "production deployment FAILED - rollback initiated"
          status: failure
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
