apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: api-prod
  labels:
    app: api
spec:
  # Changed from LoadBalancer to ClusterIP
  # External access should be through Ingress controller
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
  selector:
    app: api
