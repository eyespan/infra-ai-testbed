apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: api-prod
  labels:
    app: api
type: Opaque
stringData:
  # In production, use external secret management (e.g., Sealed Secrets, External Secrets Operator, Vault)
  # This is base64 encoded when applied, but still stored in etcd
  # Consider using encryption at rest for etcd
  DB_PASSWORD: "supersecret"
