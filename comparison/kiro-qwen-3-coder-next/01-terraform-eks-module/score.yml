critical_security_fail: true
critical_security_notes: "The EKS cluster explicitly enables public API endpoint access to 0.0.0.0/0. The IRSA trust policy also combines StringEquals and StringLike conditions on the same OIDC sub claim, making the trust policy contradictory/unusable as written. The generated module therefore does not meet the stated production-ready security expectations."

findings:
  - severity: critical
    title: "EKS API endpoint exposed publicly to the entire internet"
    evidence: "modules/eks/main.tf sets endpoint_public_access = true and public_access_cidrs = [\"0.0.0.0/0\"]."
    dimension: security

  - severity: high
    title: "IRSA trust policy contains contradictory conditions"
    evidence: "modules/eks/irsa.tf applies both StringEquals and StringLike conditions to the same OIDC :sub claim. StringEquals requires the exact aws-node service account while StringLike simultaneously requires a kube-system wildcard or aws-efs-csi-driver service account pattern."
    dimension: security

  - severity: high
    title: "Staging example references an undeclared module variable"
    evidence: "staging/main.tf passes environment = \"staging\" to the EKS module, but the provided modules/eks/variables.tf does not declare an environment variable."
    dimension: correctness

  - severity: high
    title: "Encryption configuration is not cleanly optional"
    evidence: "aws_eks_cluster.this always declares encryption_config and sets provider.key_arn to null when enable_cluster_encryption is false. The module does not conditionally omit the encryption configuration."
    dimension: correctness

  - severity: medium
    title: "KMS node permissions default to wildcard resource"
    evidence: "modules/eks/iam.tf grants kms:Decrypt and kms:GenerateDataKey with Resource = \"*\" when enable_cluster_encryption is true but kms_key_arn is empty."
    dimension: security

  - severity: medium
    title: "IRSA role grants broad wildcard service-account trust"
    evidence: "The StringLike condition permits system:serviceaccount:kube-system:* and system:serviceaccount:aws-efs-csi-driver:* rather than restricting trust to explicitly required service accounts."
    dimension: security

  - severity: medium
    title: "No actual validation evidence was supplied"
    evidence: "The completion output describes the files as complete but does not provide successful terraform fmt, terraform validate, plan, or other automated validation results."
    dimension: reliability

