apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  alerts.yml: |
    groups:
      - name: kubernetes-alerts
        rules:
          # Pod crash looping alert
          - alert: PodCrashLooping
            expr: rate(container_restart_count_total[5m]) > 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been restarting frequently."

          # High container memory alert
          - alert: HighContainerMemoryUsage
            expr: |
              container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.9
              and container_memory_working_set_bytes > 100 * 1024 * 1024
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "Container {{ $labels.container }} is using high memory"
              description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."

          # Node disk pressure alert
          - alert: NodeDiskPressure
            expr: node_filesystem_avail_bytes / node_filesystem_size_bytes < 0.1
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.instance }} is experiencing disk pressure"
              description: "Node {{ $labels.instance }} has less than 10% filesystem space available."

          # Prometheus instance down alert
          - alert: PrometheusInstanceDown
            expr: up{job="prometheus"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus instance is down"
              description: "Prometheus instance {{ $labels.instance }} has been down for more than 5 minutes."

          # Alertmanager down alert
          - alert: AlertmanagerDown
            expr: up{job="alertmanager"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Alertmanager is down"
              description: "Alertmanager instance {{ $labels.instance }} has been down for more than 5 minutes."
