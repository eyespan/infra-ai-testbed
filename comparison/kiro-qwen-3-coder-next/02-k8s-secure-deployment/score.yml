  notes: "Kiro produced the complete 10-file Kubernetes security-hardening deliverable. The manifests substantially address the starter security issues through a dedicated namespace, ServiceAccount, namespace-scoped RBAC, non-root execution, dropped capabilities, read-only root filesystem, resource limits, probes, ClusterIP service, NetworkPolicy, and PDB. However, secret.yaml commits a plaintext production DB password, triggering the rubric's automatic security failure."

