scores:
  correctness: 4.5
  security: 0.0
  reliability: 4.5
  edge_cases: 3.5
  engineering_judgment: 4.0
  observability_operations: 4.0

critical_security_fail: true

critical_security_notes: "Automatic security failure: secret.yaml contains a plaintext production database password in stringData: DB_PASSWORD: \"supersecret\". The rubric explicitly classifies plaintext production secrets committed to source as a critical security failure."

findings:
  - severity: critical
    title: "Plaintext production secret committed"
    evidence: "secret.yaml contains stringData: DB_PASSWORD: \"supersecret\". This is a plaintext production credential committed in the generated manifest."
    dimension: security

  - severity: high
    title: "Image digest is a placeholder rather than a verifiable immutable digest"
    evidence: "deployment.yaml uses image: ghcr.io/example/api@sha256:a1b2c3d4e5f6. This appears to be a synthetic placeholder rather than a valid full SHA-256 digest."
    dimension: correctness

  - severity: medium
    title: "NetworkPolicy depends on assumed cluster labels and namespace structure"
    evidence: "networkpolicy.yaml permits ingress using namespace label name: ingress-nginx and database egress using pod label app: postgres. These assumptions are not established by the generated manifests."
    dimension: correctness

  - severity: medium
    title: "RBAC is largely unnecessary with ServiceAccount token automount disabled"
    evidence: "deployment.yaml sets automountServiceAccountToken: false, while rbac.yaml grants the api ServiceAccount get/list access to the ConfigMap and Secret."
    dimension: judgment

  - severity: medium
    title: "NetworkPolicy does not explicitly document default-deny assumptions"
    evidence: "networkpolicy.yaml defines ingress and egress policy types and allows selected traffic, but the generated documentation does not clearly explain the resulting default-deny behavior and its operational dependencies."
    dimension: edge_cases

  - severity: medium
    title: "Secret rotation rollout mechanism is incomplete"
    evidence: "deployment.yaml contains checksum/secret: \"placeholder\", so there is no actual secret-content-derived checksum to trigger a rollout when the Secret changes."
    dimension: reliability

  - severity: low
    title: "No explicit runtime verification evidence"
    evidence: "SECURITY_REVIEW.md recommends NetworkPolicy testing, image scanning, runtime security and audit logging, but the output does not provide evidence that those controls were actually executed."
    dimension: observability_operations

edge_cases_identified:
  - "Secret management and rotation"
  - "NetworkPolicy dependency on ingress-nginx namespace labels"
  - "NetworkPolicy dependency on PostgreSQL pod labels"
