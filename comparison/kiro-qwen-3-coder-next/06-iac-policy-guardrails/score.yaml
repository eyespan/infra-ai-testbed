critical_security_fail: true
critical_security_notes: "The IaC guardrails contain security-relevant false-negative paths. The S3 policy's supposed default-encryption check examines bucket_public_access_block rather than an encryption configuration, and the tag policy's deny rule applies to untaggable resources instead of taggable resources. Consequently, required security/tagging controls can fail open. The policy tests are also inverted: tests named *_should_fail use 'not deny', which asserts that no denial exists rather than asserting that a denial is produced."

findings:
  - severity: critical
    title: "S3 encryption policy has an incorrect default-encryption check"
    evidence: "s3_bucket_has_default_encryption(resource) checks resource.change.after.bucket_public_access_block[_], which is unrelated to S3 server-side encryption. A bucket with a public-access-block configuration could therefore satisfy the encryption check without actually having encryption enabled."
    dimension: security

  - severity: critical
    title: "Required-tag policy denies the wrong resource class"
    evidence: "The deny rule calls is_untaggable_resource(resource.type) before checking tags. This means the policy evaluates resources explicitly classified as untaggable, while resources classified as taggable are not enforced by the deny rule. The defined is_taggable_resource rule is never used."
    dimension: security

  - severity: high
    title: "OPA/Rego tests are logically inverted"
    evidence: "Tests named test_*_should_fail use 'not deny with input as ...'. That expression succeeds when deny does not exist, so the tests do not assert that violations are detected. The same inversion appears in the S3, security-group, EKS, and tag tests."
    dimension: correctness

  - severity: high
    title: "Tag policy test coverage does not expose the policy implementation error"
    evidence: "The test fixtures use aws_instance as a resource requiring tags, but aws_instance is included in UNTAGGABLE_RESOURCES. This allows the incorrect policy structure to appear consistent with the test intent while failing to enforce tags on genuinely taggable resources."
    dimension: correctness

  - severity: high
    title: "CI documentation does not match a reliable Terraform plan workflow"
    evidence: "The CI example runs 'conftest test -p policies tfplan.json', but the documented Terraform command creates tfplan as a binary plan and does not show 'terraform show -json tfplan > tfplan.json'. The example therefore does not provide a complete working Terraform-plan-to-OPA path."
    dimension: reliability

  - severity: medium
    title: "Policy coverage contains contradictory resource classifications"
    evidence: "Several resources appear in both the untaggable and taggable sets, including aws_s3_bucket, aws_instance, aws_security_group, aws_lb_target_group, aws_nat_gateway, aws_internet_gateway, aws_route_table, aws_eip, aws_cloudwatch_metric_alarm, aws_cloudwatch_log_group, aws_kms_key, aws_secretsmanager_secret and others."
    dimension: judgment

  - severity: medium
    title: "S3 KMS helper is defined but unused"
    evidence: "s3_bucket_has_kms_encryption is defined but never referenced by the deny rule. The effective encryption decision therefore relies only on the explicit configuration existence check and the incorrect bucket_public_access_block check."
    dimension: edge_cases

