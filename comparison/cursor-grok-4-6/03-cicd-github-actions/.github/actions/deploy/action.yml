name: Deploy
description: Replacement for platform.deploy(environment, image_tag). Credentials via OIDC, not static keys.
inputs:
  environment:
    description: staging or production
    required: true
  image-tag:
    description: Twelve-character git SHA tag pushed to the registry
    required: true
  role-to-assume:
    required: true
  aws-region:
    required: true
  slack-webhook-url:
    required: true
runs:
  using: composite
  steps:
    - name: AWS OIDC
      uses: ./.github/actions/configure-aws-oidc
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
    - name: Apply image
      shell: bash
      env:
        APP: ${{ env.APP }}
        REGISTRY: ${{ env.REGISTRY }}
        ENVIRONMENT: ${{ inputs.environment }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        set -euo pipefail
        if [[ -z "${IMAGE_TAG}" || -z "${APP}" || -z "${REGISTRY}" ]]; then
          echo "APP, REGISTRY, and image tag are required" >&2
          exit 1
        fi
        image="${REGISTRY}/${APP}:${IMAGE_TAG}"
        echo "platform.deploy('${ENVIRONMENT}', '${IMAGE_TAG}') -> ${image}"
        # Org-specific apply lives here (helm upgrade, kubectl set image, ECS).
        # Fail closed if the operator did not wire a real deployer.
        if [[ -z "${DEPLOY_IMPLEMENTATION:-}" ]]; then
          echo "Set secret/var DEPLOY_IMPLEMENTATION to the real deploy command." >&2
          echo "Refusing to no-op a production-shaped deploy." >&2
          exit 1
        fi
        eval "${DEPLOY_IMPLEMENTATION}"
    - name: Slack
      uses: ./.github/actions/notify-slack
      with:
        message: "${{ inputs.environment }} ${{ inputs.image-tag }}"
        slack-webhook-url: ${{ inputs.slack-webhook-url }}
