name: Configure AWS OIDC
description: Assume an environment deploy role via GitHub OIDC. Replaces long-lived keys the Jenkins agents used implicitly via platform.*.
inputs:
  role-to-assume:
    description: IAM role ARN (from GitHub vars, not a hardcoded account id)
    required: true
  aws-region:
    description: AWS region (from GitHub vars)
    required: true
runs:
  using: composite
  steps:
    - name: Assume deploy role
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.aws-region }}
        role-session-name: payments-api-gha
