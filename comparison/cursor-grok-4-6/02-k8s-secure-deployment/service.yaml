apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: api
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
# Public TLS terminates at ingress in namespace ingress-nginx.
# LoadBalancer here would bypass that path and fight the NetworkPolicy.
