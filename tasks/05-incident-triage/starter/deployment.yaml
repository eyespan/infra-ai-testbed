apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: prod
  annotations:
    kubernetes.io/change-cause: reduce memory limit to 64Mi to save cost
    deployment.kubernetes.io/revision: "14"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments
  template:
    metadata:
      labels:
        app: payments
    spec:
      containers:
        - name: payments
          image: ghcr.io/example/payments-api:a1b2c3d4e5f6
          ports:
            - containerPort: 8080
          env:
            - name: NODE_OPTIONS
              value: --max-old-space-size=256
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
